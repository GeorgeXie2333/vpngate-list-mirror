name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'latest.json'
      - 'pool/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Python offline tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript offline tests
        run: node --test tests/test_consumer.mjs tests/test_pool_consumer.mjs workers/test/core.test.mjs workers/test/dashboard.test.mjs
