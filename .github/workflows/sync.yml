name: Sync VPN Gate

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpngate-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Verify offline invariants before publication
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_consumer.mjs
      - name: Fetch, validate, publish and probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m mirror sync
      - name: Report an incomplete workflow
        if: failure()
        run: echo 'Workflow failed. Inspect the failing stage and publication summary before assuming a snapshot was published. The latest successful fetch remains discoverable through latest.json.' >> "$GITHUB_STEP_SUMMARY"
