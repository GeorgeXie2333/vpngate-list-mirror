name: Sync VPN Gate

on:
  # Cloudflare Worker dispatches this workflow at 29,59 * * * * (UTC).
  # Keep workflow_dispatch for both the Worker and manual refreshes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpngate-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check code, fetch, merge completed Worker results and publish
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_ENABLED: ${{ vars.POOL_ENABLED != 'false' }}
          TCP_PRUNE_ENABLED: ${{ vars.TCP_PRUNE_ENABLED != 'false' }}
          # Optional authenticated read-only KV endpoint. Never probe nodes here.
          PROBE_RESULTS_URL: ${{ vars.PROBE_RESULTS_URL }}
          PROBE_READ_TOKEN: ${{ secrets.PROBE_READ_TOKEN }}
        run: python -m mirror sync
      - name: Report an incomplete workflow
        if: failure()
        run: echo 'Workflow failed. Inspect the failing stage and publication summary before assuming a snapshot was published. The latest successful fetch remains discoverable through latest.json.' >> "$GITHUB_STEP_SUMMARY"
